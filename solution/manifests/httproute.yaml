apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: guestbook
  labels:
    app: guestbook
    project: dojo
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - guestbook.lvh.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: guestbook
          port: 3000
